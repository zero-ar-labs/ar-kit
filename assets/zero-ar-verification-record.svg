<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A Zero-AR verification plan</title>
  <desc id="desc">A real compiled verification plan maps acceptance rules to pinned deterministic validators, named evidence coverage, cost and stated limitations.</desc>
  <style>
    .language { font-family: Archivo, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .record { font-family: "Azeret Mono", "SFMono-Regular", Consolas, monospace; }
  </style>

  <rect width="1200" height="650" fill="#F4F4F2"/>
  <path d="M50 39h21v5H60v11H50z" fill="#C08A3E"/>
  <text class="language" x="86" y="55" fill="#8A5F1E" font-size="15" font-weight="600">Recorded verification plan</text>
  <text class="language" x="50" y="104" fill="#16181A" font-size="36" font-weight="650">The model does the work. It does not grade itself.</text>
  <text class="language" x="50" y="135" fill="#6B7173" font-size="17">Each acceptance rule names the validator, coverage, sufficiency, cost and limit before work begins.</text>

  <rect x="50" y="164" width="1100" height="436" rx="8" fill="#16181A"/>
  <text class="record" x="78" y="201" fill="#E8E9E6" font-size="14">verification plan  sha256:41ce5ea5ed20b9170db82ff170029b60d12860264d19a79566bb654ce8502479</text>
  <circle cx="85" cy="229" r="6" fill="#2F6B3F"/>
  <text class="record" x="101" y="234" fill="#E8E9E6" font-size="14">verified completion reachable</text>
  <text class="record" x="78" y="263" fill="#8E9497" font-size="12">verification cost</text>
  <text class="record" x="242" y="263" fill="#E8E9E6" font-size="12">6000 of 600000 compute_ms</text>
  <text class="record" x="606" y="263" fill="#8E9497" font-size="12">attention</text>
  <text class="record" x="704" y="263" fill="#E8E9E6" font-size="12">no named-human validator is selected</text>

  <line x1="78" y1="288" x2="1122" y2="288" stroke="#43494A"/>
  <text class="language" x="78" y="318" fill="#8E9497" font-size="12">Rule</text>
  <text class="language" x="445" y="318" fill="#8E9497" font-size="12">Pinned validator</text>
  <text class="language" x="818" y="318" fill="#8E9497" font-size="12">Coverage</text>
  <text class="language" x="996" y="318" fill="#8E9497" font-size="12">Sufficient</text>
  <line x1="78" y1="332" x2="1122" y2="332" stroke="#43494A"/>

  <text class="record" x="78" y="364" fill="#E8E9E6" font-size="12">every-item-has-nonempty-output</text>
  <text class="record" x="445" y="364" fill="#E8E9E6" font-size="12">items.nonempty-output@1.0.0</text>
  <circle cx="832" cy="359" r="6" fill="#2F6B3F"/>
  <text class="record" x="848" y="364" fill="#E8E9E6" font-size="12">yes</text>
  <circle cx="1010" cy="359" r="6" fill="#2F6B3F"/>
  <text class="record" x="1026" y="364" fill="#E8E9E6" font-size="12">yes</text>
  <line x1="78" y1="384" x2="1122" y2="384" stroke="#2D3133"/>

  <text class="record" x="78" y="416" fill="#E8E9E6" font-size="12">every-declared-item-is-accounted</text>
  <text class="record" x="445" y="416" fill="#E8E9E6" font-size="12">ledger.reconciles@1.0.0</text>
  <circle cx="832" cy="411" r="6" fill="#2F6B3F"/>
  <text class="record" x="848" y="416" fill="#E8E9E6" font-size="12">yes</text>
  <circle cx="1010" cy="411" r="6" fill="#2F6B3F"/>
  <text class="record" x="1026" y="416" fill="#E8E9E6" font-size="12">yes</text>

  <rect x="78" y="449" width="1044" height="118" rx="5" fill="#202325" stroke="#43494A"/>
  <text class="language" x="102" y="479" fill="#8E9497" font-size="12">Declared limits remain part of the record</text>
  <text class="record" x="102" y="508" fill="#E8E9E6" font-size="12">A compiled plan has not executed a validator and does not establish correctness.</text>
  <text class="record" x="102" y="535" fill="#E8E9E6" font-size="12">A pass establishes output presence only; it does not establish that an output is correct.</text>
</svg>
