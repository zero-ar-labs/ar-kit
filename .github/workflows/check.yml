# The generated public artifact gate.
#
# What this is: it checks the byte manifest and installs every package tarball.
# How it fits: the public repository accepts no artifact that cannot reproduce
# its source binding and clean-consumer behavior.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '23.6'
      - run: npm run check
