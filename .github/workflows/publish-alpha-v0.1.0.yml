# The one-release npm publisher.
#
# What this is: it publishes the source-bound v0.1.0 package set once.
# How it fits: the public repository supplies GitHub provenance while the
# immutable export commit supplies every package byte and its verified
# clean-consumer report.
name: publish npm alpha v0.1.0
on:
  push:
    branches: [codex/publish-alpha-v0.1.0]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-npm-alpha-v0.1.0
  cancel-in-progress: false
env:
  ZERO_AR_SOURCE_COMMIT: 30ea6e0b1b9ec8f9147a06c7e456a1ec516cc41d
  ZERO_AR_PUBLIC_KIT_COMMIT: 1a93ee8295b4a6bcadac46a475bb8c0c89061e99
jobs:
  publish:
    if: github.repository == 'zero-ar-labs/ar-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1a93ee8295b4a6bcadac46a475bb8c0c89061e99
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use the provenance-capable npm client
        run: npm install --global npm@11.6.2
      - name: Verify the immutable public package set
        run: |
          test "$(git rev-parse HEAD)" = "$ZERO_AR_PUBLIC_KIT_COMMIT"
          test "$(cat SOURCE_COMMIT)" = "$ZERO_AR_SOURCE_COMMIT"
          npm run check
      - name: Refuse an existing v0.1.0 package
        run: |
          for package in \
            @zero-ar/contracts@0.1.0 \
            @zero-ar/client@0.1.0 \
            @zero-ar/conformance@0.1.0 \
            @zero-ar/testkit@0.1.0 \
            @zero-ar/tool-kit@0.1.0 \
            @zero-ar/validator-kit@0.1.0 \
            @zero-ar/sdk@0.1.0 \
            @zero-ar/cli@0.1.0 \
            @zero-ar/mcp@0.1.0
          do
            if npm view "$package" version >/dev/null 2>&1; then
              echo "$package already exists. Stop before changing the release set." >&2
              exit 1
            fi
          done
      - name: Publish the source-bound alpha packages with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish ./release/tarballs/zero-ar-contracts-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-client-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-conformance-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-testkit-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-tool-kit-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-validator-kit-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-sdk-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-cli-0.1.0.tgz --access public --tag alpha --provenance
          npm publish ./release/tarballs/zero-ar-mcp-0.1.0.tgz --access public --tag alpha --provenance
      - name: Confirm every alpha tag
        run: |
          test "$(npm view @zero-ar/contracts dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/client dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/conformance dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/testkit dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/tool-kit dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/validator-kit dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/sdk dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/cli dist-tags.alpha)" = 0.1.0
          test "$(npm view @zero-ar/mcp dist-tags.alpha)" = 0.1.0
