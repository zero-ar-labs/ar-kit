# The one-release npm publisher.
#
# What this is: it publishes the source-bound v0.5.0 package set once.
# How it fits: the public repository supplies GitHub provenance while the
# immutable export commit supplies every package byte and its consumer proof.
name: publish npm v0.5.0

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-v0.5.0
  cancel-in-progress: false

env:
  ZERO_AR_SOURCE_COMMIT: f7cd49e89603091c0e79f74d95a9e6fd879c0bb4
  ZERO_AR_PUBLIC_KIT_COMMIT: 2fb64618ef55cebc6273ed66234e5a1ee670b16a

jobs:
  publish:
    if: github.repository == 'zero-ar-labs/ar-kit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the immutable developer kit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ZERO_AR_PUBLIC_KIT_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          registry-url: https://registry.npmjs.org

      - name: Use the provenance-capable npm client
        run: npm install --global npm@11.6.2

      - name: Verify the immutable package set
        run: |
          test "$(git rev-parse HEAD)" = "$ZERO_AR_PUBLIC_KIT_COMMIT"
          test "$(cat SOURCE_COMMIT)" = "$ZERO_AR_SOURCE_COMMIT"
          npm run check

      - name: Checkout the release operator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-operator
          sparse-checkout: scripts/publish-npm-v0.5.0.mjs
          sparse-checkout-cone-mode: false

      - name: Publish and verify the source-bound package set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .release-operator/scripts/publish-npm-v0.5.0.mjs
